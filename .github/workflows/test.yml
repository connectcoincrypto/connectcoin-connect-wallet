name: Wallet tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            helpers/requirements.txt
            helpers/requirements-build.txt
      - run: npm ci
        timeout-minutes: 5
      - run: npm run check
      - name: Test wallet logic with bounded waits
        timeout-minutes: 5
        run: npm test
      - run: npm run setup:claims
        timeout-minutes: 5
        env:
          # On Windows `py -3` can select a different installed Python than
          # setup-python. Build and test the helper with the selected runtime.
          PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Cache verified Electron downloads
        # Cache archives only, never an extracted executable or wallet profile.
        # Electron rechecks archives against its bundled SHA-256 manifest.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        with:
          path: ${{ runner.temp }}/connectwallet-electron-cache
          key: electron-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
      - name: Prepare Electron runtime separately from UI tests
        timeout-minutes: 5
        env:
          electron_config_cache: ${{ runner.temp }}/connectwallet-electron-cache
        run: node -e "require('electron')"
      - name: Install Linux Electron test dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: npx playwright install-deps chromium
      - name: Test Electron UI with an isolated profile
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: xvfb-run --auto-servernum npm run test:ui
      - name: Test Electron UI with an isolated profile on native desktop
        if: runner.os != 'Linux'
        timeout-minutes: 5
        run: npm run test:ui
      - name: Test Electron responsiveness under claim progress bursts
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: xvfb-run --auto-servernum npm run test:ui:load
      - name: Test RSA policy review and cancellation
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: xvfb-run --auto-servernum npm run test:ui:rsa
      - name: Test RSA policy review and cancellation on native desktop
        if: runner.os != 'Linux'
        timeout-minutes: 5
        run: npm run test:ui:rsa
      - name: Test locked wallet recovery and replacement
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: xvfb-run --auto-servernum npm run test:ui:recovery
